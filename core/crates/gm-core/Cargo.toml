[package]
name = "gm-core"
description = "GramMini: lõi (phiên đăng nhập, dịch vụ cho app)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gm-net = { path = "../gm-net" }
gm-opus = { path = "../gm-opus" }
grammers-client = { workspace = true, features = ["fs"] }
grammers-mtsender.workspace = true
grammers-session = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sticker WebP → PNG (iOS 5 / 6 không đọc được WebP) — Rust thuần, khỏi vendor libwebp
image-webp = "0.2"
png = "0.18"
# HTTPS cho cập nhật OTA (GitHub Releases): rustls + bộ chứng chỉ gốc Mozilla đóng trong tệp chạy — iOS 5 / 6 không tự vào được
# GitHub (TLS / chứng chỉ gốc cũ). ring vá cho armv7 Apple: tools/rust/cargo-ios6.sh (vendor-ring.sh), như Côn Bằng TV.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
# statvfs (chỗ trống của máy), utimes (đánh dấu tệp đệm vừa dùng)
libc = "0.2"
