[package]
name = "gm-call"
description = "GramMini: gọi thoại 1-1 Telegram (D38) — trao khoá DH, emoji khoá; sau: tgcalls V2 (ICE, DTLS-SRTP, Opus)"
version.workspace = true
edition = "2024"  # mã phỏng theo Ferrogram dùng let chains
license.workspace = true

[dependencies]
# Cùng phiên bản RustCrypto / bigint với gm-net và grammers (khỏi dựng hai bản trên armv7)
num-bigint = "0.5"
sha1 = "0.11"
sha2 = "0.11"
getrandom = "0.4"
aes = "0.9"
ctr = "0.10"
hmac = "0.13"
gm-opus = { path = "../gm-opus" }
# Phần truyền âm thanh phỏng theo Ferrogram (src/tg/): báo hiệu JSON, async UDP, DTLS 1.2 (webrtc-rs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1"
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
webrtc-dtls = "0.12"
webrtc-util = { version = "0.11", default-features = false, features = ["conn"] }
async-trait = "0.1"
crc32fast = "1"
