[package]
name = "gm-cli"
description = "GramMini: chạy thử lõi trên PC (Windows / Linux) và trên máy iOS qua SSH"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
gm-net = { path = "../gm-net" }
gm-core = { path = "../gm-core" }
gm-opus = { path = "../gm-opus" }
gm-lottie = { path = "../gm-lottie" }
gm-webm = { path = "../gm-webm" }
png = "0.18"
grammers-client.workspace = true
grammers-mtsender.workspace = true
grammers-session.workspace = true
grammers-tl-types = { workspace = true, features = ["tl-mtproto"] }
tokio = { workspace = true, features = ["rt", "time", "net"] }
serde_json = "1"

# Nhập mật khẩu 2FA không hiện ra màn hình (đăng nhập làm trên PC)
[target.'cfg(not(target_os = "ios"))'.dependencies]
rpassword = "7"
